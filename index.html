<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Netflix+Sans:wght@400;700&amp;display=swap">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
<div class="nav-container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix" class="logo">
            <input type="text" class="search" placeholder="Search titles..." id="search">
            <div class="nav-menu">
                <a href="#" class="nav-link" data-page="home">Home</a>
                <a href="#" class="nav-link" data-page="tv-shows">TV Shows</a>
                <a href="#" class="nav-link" data-page="movies">Movies</a>
                <a href="#" class="nav-link" data-page="new-popular">New &amp; Popular</a>
                <a href="#" class="nav-link" data-page="my-list">My List</a>
            </div>
            <div class="nav-right">
                <div class="hamburger" id="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <select class="language">
                    <option>English</option>
                </select>
                <img src="https://via.placeholder.com/32x32/000000/FFFFFF?text=👤" alt="Profile" class="profile">
            </div>
            <div class="mobile-menu" id="mobile-menu">
                <a href="#" class="nav-link" data-page="home">Home</a>
                <a href="#" class="nav-link" data-page="tv-shows">TV Shows</a>
                <a href="#" class="nav-link" data-page="movies">Movies</a>
                <a href="#" class="nav-link" data-page="new-popular">New &amp; Popular</a>
                <a href="#" class="nav-link" data-page="my-list">My List</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
<div class="hero" id="hero">
        <div class="hero-bg" id="hero-bg"></div>
        <div class="hero-content">
            <div id="hero-info">
                <!-- Dynamic hero content populated by JS -->
            </div>
            <div class="hero-buttons">
                <button class="btn-play" id="hero-play">▶ Play</button>
                <button class="btn-info" id="hero-info-btn">ℹ More Info</button>
            </div>
        </div>
        <div class="hero-fade"></div>
    </div>

    <!-- Rows of Content -->
<main class="main">
        <section id="home" class="page active">
            <div class="row">
                <h2>Trending Now</h2>
                <div class="row-posters" id="trending-home">
                    <!-- Posters populated by JS -->
                </div>
            </div>
            <div class="row">
                <h2>Top 10 TV Shows</h2>
                <div class="row-posters" id="top10-home">
                    <!-- Posters populated by JS -->
                </div>
            </div>
            <div class="row">
                <h2>Action Movies</h2>
                <div class="row-posters" id="action-home">
                    <!-- Posters populated by JS -->
                </div>
            </div>
            <div class="row">
                <h2>Comedies</h2>
                <div class="row-posters" id="comedy-home">
                    <!-- Posters populated by JS -->
                </div>
            </div>
            <div class="row">
                <h2>Horror Movies</h2>
                <div class="row-posters" id="horror-home">
                    <!-- Posters populated by JS -->
                </div>
            </div>
        </section>

        <section id="tv-shows" class="page">
            <div class="row">
                <h2>Popular TV Shows</h2>
                <div class="row-posters" id="tv-popular">
                    <!-- JS -->
                </div>
            </div>
            <div class="row">
                <h2>TV Comedies</h2>
                <div class="row-posters" id="tv-comedy">
                    <!-- JS -->
                </div>
            </div>
        </section>

        <section id="movies" class="page">
            <div class="row">
                <h2>Action Movies</h2>
                <div class="row-posters" id="movies-action">
                    <!-- JS -->
                </div>
            </div>
            <div class="row">
                <h2>Comedies</h2>
                <div class="row-posters" id="movies-comedy">
                    <!-- JS -->
                </div>
            </div>
            <div class="row">
                <h2>Horror Movies</h2>
                <div class="row-posters" id="movies-horror">
                    <!-- JS -->
                </div>
            </div>
        </section>

        <section id="new-popular" class="page">
            <div class="row">
                <h2>Trending Now</h2>
                <div class="row-posters" id="new-trending">
                    <!-- JS -->
                </div>
            </div>
            <div class="row">
                <h2>Today's Top 10</h2>
                <div class="row-posters" id="new-top10">
                    <!-- JS -->
                </div>
            </div>
        </section>

        <section id="my-list" class="page">
            <div class="row-full">
                <h2>My List (<span id="mylist-count">0</span>)</h2>
                <div class="row-posters" id="mylist-posters">
                    <!-- JS populated from localStorage -->
                </div>
            </div>
        </section>
    </main>

    <!-- Modal for Preview -->
<div class="modal" id="modal">
        <div class="modal-content">
            <span class="close">&amp;times;</span>
            <div class="modal-video">
                <iframe id="trailer-iframe" src="" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>
            </div>
            <div class="modal-info">
                <h2 id="modal-title"></h2>
                <p id="modal-desc"></p>
                <div class="modal-buttons">
                    <button class="btn-play">▶ Play</button>
                    <button class="btn-info">ℹ More Info</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
